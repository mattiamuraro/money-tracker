<div class="login-shell"><div class="login-card editor-card"><p class="eyebrow">Money Tracker</p><h2>{{ isSignUpMode ? 'Create Account' : 'Sign In' }}</h2><section *ngIf="errorMessage" class="banner banner-error">{{ errorMessage }}</section><form class="login-form" (ngSubmit)="onSubmit()"><div class="form-field"><label class="field-label" for="username">Username</label><input id="username" type="text" [(ngModel)]="username" name="username" required autocomplete="username" /></div><div class="form-field"><label class="field-label" for="password">Password</label><input id="password" type="password" [(ngModel)]="password" name="password" required autocomplete="current-password" /></div><div class="form-field" *ngIf="isSignUpMode"><label class="field-label" for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password" /></div><button class="primary-button" type="submit" [disabled]="isLoading || !username || !password || (isSignUpMode && !confirmPassword)">{{ isLoading ? (isSignUpMode ? 'Creating account...' : 'Signing in...') : (isSignUpMode ? 'Create Account' : 'Sign In') }}</button></form><div class="login-footer" *ngIf="allowRegistration"><span class="muted-copy">{{ isSignUpMode ? 'Already have an account?' : 'New here?' }}</span><button class="text-button" type="button" (click)="toggleMode()">{{ isSignUpMode ? 'Sign In' : 'Create Account' }}</button></div></div></div>
