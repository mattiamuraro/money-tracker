<div class="app-shell">
  <header class="hero-panel">
    <div>
      <p class="eyebrow">Finance home</p>
      <h1>{{ title }}</h1>
      <p class="hero-copy">
        Manage daily payments and recurring forecasts from one clear workspace with live summaries,
        inline editing, and a fast overview of what is coming next.
      </p>
    </div>

    <div class="hero-actions">
      <a class="secondary-button nav-link" routerLink="/" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a class="secondary-button nav-link" routerLink="/payments" routerLinkActive="nav-link-active">Payments</a>
      <a class="secondary-button nav-link" routerLink="/forecasts" routerLinkActive="nav-link-active">Forecasts</a>
      <button class="primary-button" type="button" (click)="reloadDashboard()" [disabled]="isLoading">
        {{ isLoading ? 'Refreshing...' : 'Refresh data' }}
      </button>
    </div>
  </header>

  <section *ngIf="successMessage" class="banner banner-success">
    {{ successMessage }}
  </section>

  <section *ngIf="errorMessage" class="banner banner-error">
    {{ errorMessage }}
  </section>

  <router-outlet></router-outlet>
</div>
