name: Frontend Quality Gates

on:
  push:
    paths:
      - 'MoneyTracker.Frontend/**'
      - '.github/workflows/frontend-quality-gates.yml'
  pull_request:
    paths:
      - 'MoneyTracker.Frontend/**'
      - '.github/workflows/frontend-quality-gates.yml'

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MoneyTracker.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MoneyTracker.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run e2e

      - name: Production build
        run: npm run build
